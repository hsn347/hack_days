server {
    listen 80;
    server_name _ YOUR_DOMAIN.COM;

    # توجيه ملفات الواجهة React (SPA)
    location / {
        root /var/www/osmanli/dashboard/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلب manifest.json ديناميكياً لتثبيت PWA بالاسم والشعار المناسب لكل دومين
    location = /manifest.json {
        proxy_pass http://127.0.0.1:8000/api/manifest.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # توجيه طلبات API إلى FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # توجيه اتصالات WebSocket الحية
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # حظر الوصول إلى مسارات التوثيق (Swagger / ReDoc / OpenAPI) أمنياً
    location ~* ^/(docs|redoc|openapi\.json) {
        return 404;
    }
}

